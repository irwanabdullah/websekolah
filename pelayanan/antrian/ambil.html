<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ambil Nomor Antrean</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

body{
    background:#eef2f7;
    font-family:'Segoe UI',sans-serif;
}

.navbar{
    background:#0B2E59;
}

.navbar-brand{
    color:white !important;
    font-weight:bold;
}

.card{
    border:none;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.ticket{
    display:none;
    border:3px dashed #0B2E59;
    border-radius:15px;
    padding:25px;
    background:white;
}

.nomor{
    font-size:70px;
    font-weight:bold;
    color:#0B2E59;
}

.footer{
    margin-top:40px;
    background:#0B2E59;
    color:white;
    padding:15px;
    text-align:center;
}

</style>

</head>

<body>

<nav class="navbar">
<div class="container">

<a class="navbar-brand" href="index.html">

<i class="fa-solid fa-ticket"></i>

APLIKASI NOMOR ANTREAN

</a>

</div>
</nav>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="card p-4">

<h2 class="text-center text-primary">

UPT SPF SMP Negeri 13 Makassar

</h2>

<h5 class="text-center mb-4">

Ambil Nomor Antrean

</h5>

<div class="mb-3">

<label>Jenis Layanan</label>

<select id="layanan" class="form-select">

<option value="A">A - Surat Keterangan Aktif</option>
<option value="B">B - Legalisasi Ijazah</option>
<option value="C">C - Mutasi Masuk</option>
<option value="D">D - Mutasi Keluar</option>
<option value="E">E - Informasi Publik</option>
<option value="F">F - Pengaduan</option>
<option value="G">G - Tata Usaha</option>
<option value="H">H - Perpustakaan</option>
<option value="I">I - Bimbingan Konseling</option>
<option value="J">J - Sarana Prasarana</option>

</select>

</div>

<button onclick="ambilNomor()" class="btn btn-primary btn-lg w-100">

<i class="fa-solid fa-ticket"></i>

AMBIL NOMOR ANTREAN

</button>

</div>

</div>

</div>

<div class="row justify-content-center mt-4">

<div class="col-lg-6">

<div class="ticket" id="ticket">

<h4 class="text-center">

TIKET ANTREAN

</h4>

<hr>

<h5 class="text-center">

UPT SPF SMP Negeri 13 Makassar

</h5>

<div class="nomor text-center" id="nomor">

A001

</div>

<p class="text-center" id="namaLayanan"></p>

<hr>

<p id="tanggal" class="text-center"></p>

<div class="d-grid">

<button onclick="window.print()" class="btn btn-success">

<i class="fa-solid fa-print"></i>

Cetak Tiket

</button>

</div>

</div>

</div>

</div>

</div>

<footer class="footer">

UPT SPF SMP Negeri 13 Makassar © 2026

</footer>

<script>

let counter=JSON.parse(localStorage.getItem("counter"))||{
A:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0,I:0,J:0
};

let antrean=JSON.parse(localStorage.getItem("antrean"))||[];

function ambilNomor(){

let layanan=document.getElementById("layanan");

let kode=layanan.value;

counter[kode]++;

let nomor=kode+String(counter[kode]).padStart(3,'0');

document.getElementById("ticket").style.display="block";

document.getElementById("nomor").innerHTML=nomor;

document.getElementById("namaLayanan").innerHTML=
layanan.options[layanan.selectedIndex].text;

document.getElementById("tanggal").innerHTML=
new Date().toLocaleString('id-ID');

antrean.push({
nomor:nomor,
layanan:layanan.options[layanan.selectedIndex].text,
status:"Menunggu"
});

localStorage.setItem("counter",JSON.stringify(counter));
localStorage.setItem("antrean",JSON.stringify(antrean));

}

</script>

</body>
</html>
