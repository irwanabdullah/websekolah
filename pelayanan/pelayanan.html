<section class="hero">

<h2>STANDAR PELAYANAN PUBLIK</h2>

<p>UPT SPF SMP Negeri 13 Makassar</p>

</section>

<div class="container mt-4">

<input class="form-control mb-4" id="cari" placeholder="Cari layanan..." onkeyup="filterLayanan()">

<div class="accordion" id="pelayananAccordion">

<script>

const layanan=[

"Surat Keterangan Aktif Peserta Didik",

"Legalisasi Ijazah",

"Mutasi Masuk",

"Mutasi Keluar",

"Pelayanan Informasi Publik",

"Pengaduan Masyarakat",

"Pelayanan Tata Usaha",

"Pelayanan Perpustakaan",

"Pelayanan Bimbingan dan Konseling",

"Peminjaman Sarana dan Prasarana"

];

document.write(layanan.map((n,i)=>`

<div class="accordion-item layanan">

<h2 class="accordion-header">

<button class="accordion-button collapsed"

data-bs-toggle="collapse"

data-bs-target="#a${i}">

${i+1}. ${n}

</button>

</h2>

<div id="a${i}" class="accordion-collapse collapse"

data-bs-parent="#pelayananAccordion">

<div class="accordion-body">

<table class="table table-bordered">

<tr>

<th width="30%">Persyaratan</th>

<td>Melengkapi dokumen sesuai jenis pelayanan.</td>

</tr>

<tr>

<th>Prosedur</th>

<td>

1. Mengajukan permohonan.<br>

2. Verifikasi berkas.<br>

3. Diproses petugas.<br>

4. Dokumen diterbitkan.

</td>

</tr>

<tr>

<th>Jangka Waktu</th>

<td>1 Hari Kerja</td>

</tr>

<tr>

<th>Biaya</th>

<td>Gratis</td>

</tr>

<tr>

<th>Produk Layanan</th>

<td>Dokumen sesuai jenis pelayanan.</td>

</tr>

<tr>

<th>Pengaduan</th>

<td>

Email : smpn13@makassar.go.id

<br>

Kotak Pengaduan

<br>

WhatsApp Sekolah

</td>

</tr>

</table>

<div class="text-end">

<a href="#" class="btn btn-primary btn-sm">

<i class="fa-solid fa-download"></i>

 SOP

</a>

<a href="#" class="btn btn-warning btn-sm">

<i class="fa-solid fa-diagram-project"></i>

 Flowchart

</a>

</div>

</div>

</div>

</div>

`).join(""));

</script>

</div>

</div>

<footer class="footer text-center">

<p>

<script>

function filterLayanan(){

let input=document.getElementById("cari").value.toLowerCase();

let layanan=document.getElementsByClassName("layanan");

for(let i=0;i<layanan.length;i++){

let text=layanan[i].innerText.toLowerCase();

layanan[i].style.display=text.indexOf(input)>-1?"":"none";

}

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
